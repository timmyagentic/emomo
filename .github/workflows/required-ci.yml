name: Required CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mobile: ${{ steps.scope.outputs.mobile }}
      gateway: ${{ steps.scope.outputs.gateway }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs

  cli-platforms:
    name: CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
        working-directory: cli
      - run: npm test
        working-directory: cli
        env:
          EMOMO_CONFIG_DIR: ${{ runner.temp }}/emomo-config
          npm_config_cache: ${{ runner.temp }}/emomo-npm

  agent-cli-required:
    name: Agent CLI and search checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bootstrap secret-free Agent development
        run: node scripts/dev.mjs bootstrap agent

      - name: Verify Agent development contract
        run: node scripts/dev.mjs check agent

  gateway-required:
    name: Legacy gateway checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gateway != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install gateway dependencies
        working-directory: deployments/cloudflare/api-gateway
        run: npm ci

      - name: Test and typecheck Agent gateway
        working-directory: deployments/cloudflare/api-gateway
        run: |
          npm test
          npm run typecheck

  backend-required:
    name: Backend required checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node for Go isolation regression
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify persistent Go configuration is isolated
        run: node --test scripts/test/goenv.test.mjs

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build backend
        working-directory: backend
        run: go build ./...

  frontend-required:
    name: Frontend required checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mobile-required:
    name: Mobile required checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Regenerate mobile protobuf DTOs
        working-directory: mobile
        run: npm run gen

      - name: Verify generated mobile DTOs are committed
        working-directory: mobile
        run: git diff --exit-code -- gen

      - name: Run mobile tests
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Lint mobile app
        working-directory: mobile
        run: npm run lint

      - name: Run Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Check mobile artifact workflow wiring
        run: bash scripts/check-mobile-ci.sh
